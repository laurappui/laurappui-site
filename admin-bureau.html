<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bureau Laur’Appui</title><style>
:root{--navy:#12364c;--gold:#a87338;--cream:#f7f0e5;--line:#ded7cd;--muted:#66737b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:Arial,sans-serif}.hidden{display:none!important}.login{width:min(440px,92%);margin:10vh auto;background:white;padding:30px;border-radius:20px;box-shadow:0 12px 40px #12364c18}.brand{font:700 28px Georgia,serif}.login input,input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c8c0b6;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn.gold{background:var(--gold)}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:var(--navy);color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh}.side .brand{margin-bottom:30px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#e9eef1;padding:12px;border-radius:9px;cursor:pointer;margin:2px 0;font-weight:600}.nav button.active,.nav button:hover{background:#ffffff18}.main{padding:30px;max-width:1450px;width:100%}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px #12364c0b}.metric b{display:block;font:700 27px Georgia,serif;margin-top:5px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;background:#fff}.tbl th,.tbl td{padding:12px;border-bottom:1px solid #eee7df;text-align:left;white-space:nowrap}.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#f0ebe4;font-size:12px}.modal{position:fixed;inset:0;background:#102d3d99;display:grid;place-items:center;padding:20px}.modalbox{background:#fff;width:min(620px,96%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.close{float:right;background:none;border:0;font-size:25px;cursor:pointer}.notice{padding:12px;border-radius:10px;background:#fff5df;font-size:13px;margin:14px 0}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.cards{grid-template-columns:1fr 1fr}.main{padding:18px}}@media(max-width:520px){.cards,.grid2{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><section id="login" class="login"><div class="brand">Laur’Appui</div><h1>Bureau privé</h1><p class="muted">Gestion clients, devis, factures et échéances.</p><form id="loginForm"><input id="password" type="password" placeholder="Mot de passe administrateur" required><p><button class="btn">Se connecter</button></p><div id="msg" class="muted"></div></form></section>
<div id="app" class="app hidden"><aside class="side"><div class="brand">Laur’Appui</div><nav class="nav"><button data-page="dashboard" class="active">⌂ Tableau de bord</button><button data-page="clients">♙ Clients</button><button data-page="documents">▤ Devis & factures</button><button data-page="payments">€ Paiements</button><button data-page="tasks">✓ Échéances</button></nav><p><button id="logout" class="btn gold">Déconnexion</button></p></aside><main class="main"><div class="top"><div><h1 id="title">Tableau de bord</h1><div class="muted">Bureau Laur’Appui — gestion interne</div></div><button id="newBtn" class="btn">+ Nouveau</button></div><div class="notice">Version préparatoire : les champs SIRET, TVA définitive, médiateur et coordonnées bancaires seront complétés après validation.</div><div id="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">Nouveau</h2><form id="form"></form></div></div>
<script>
const $=s=>document.querySelector(s), app=$('#app'),login=$('#login'),content=$('#content');let page='dashboard',clients=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const euro=c=>(Number(c||0)/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
async function api(section,opts){const u=section?'/api/admin-office?section='+section:'/api/admin-office';const r=await fetch(u,{credentials:'same-origin',...(opts||{})});if(r.status===401){app.classList.add('hidden');login.classList.remove('hidden');return null}return r.json()}
async function load(){if(page==='payments'){location.href='admin-paiements.html';return}const d=await api(page);if(!d)return;login.classList.add('hidden');app.classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const titles={dashboard:'Tableau de bord',clients:'Clients',documents:'Devis & factures',tasks:'Échéances'};$('#title').textContent=titles[page];$('#newBtn').style.visibility=page==='dashboard'?'hidden':'visible';if(page==='dashboard')renderDash(d);else if(page==='clients'){clients=d.items;renderClients(d.items)}else if(page==='documents')renderDocs(d.items);else renderTasks(d.items)}
function renderDash(d){let m=d.metrics||{};content.innerHTML=`<div class="cards"><div class="card metric"><span class="muted">Clients actifs</span><b>${m.clients||0}</b></div><div class="card metric"><span class="muted">Devis & factures</span><b>${m.documents||0}</b></div><div class="card metric"><span class="muted">Échéances ouvertes</span><b>${m.tasks||0}</b></div><div class="card metric"><span class="muted">Paiements Stripe</span><b>${euro(m.stripe)}</b></div></div><div class="card"><h2>Derniers documents</h2>${tableDocs(d.recent||[])}</div>`}
function tableDocs(a){return `<div class="tablewrap"><table class="tbl"><thead><tr><th>N°</th><th>Client</th><th>Type</th><th>Prestation</th><th>Montant</th><th>Statut</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.client_name||'—')}</td><td>${esc(x.kind)}</td><td>${esc(x.label)}</td><td>${euro(x.amount_cents)}</td><td><span class="badge">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="6">Aucun document.</td></tr>'}</tbody></table></div>`}
function renderClients(a){content.innerHTML=`<div class="card"><div class="toolbar"><b>${a.length} client(s)</b></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Nom</th><th>Type</th><th>E-mail</th><th>Téléphone</th><th>Statut</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.name)}</b>${x.company?'<br><span class="muted">'+esc(x.company)+'</span>':''}</td><td>${esc(x.type)}</td><td>${esc(x.email||'—')}</td><td>${esc(x.phone||'—')}</td><td><span class="badge">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="5">Aucun client.</td></tr>'}</tbody></table></div></div>`}
function renderDocs(a){content.innerHTML=`<div class="card"><div class="toolbar"><b>Documents commerciaux</b></div>${tableDocs(a)}</div>`}
function renderTasks(a){content.innerHTML=`<div class="card"><div class="toolbar"><b>Échéances & tâches</b></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Échéance</th><th>Client</th><th>Tâche</th><th>Priorité</th><th>Statut</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.due_date||'—')}</td><td>${esc(x.client_name||'—')}</td><td>${esc(x.title)}</td><td>${esc(x.priority)}</td><td><span class="badge">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="5">Aucune échéance.</td></tr>'}</tbody></table></div></div>`}
async function openNew(){if(page!=='clients'&&!clients.length){const d=await api('clients');clients=d?.items||[]}const opts=clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');let html='';if(page==='clients')html=`<div class="grid2"><div class="field"><label>Type</label><select name="type"><option>particulier</option><option>professionnel</option></select></div><div class="field"><label>Nom *</label><input name="name" required></div><div class="field"><label>Entreprise</label><input name="company"></div><div class="field"><label>E-mail</label><input name="email" type="email"></div><div class="field"><label>Téléphone</label><input name="phone"></div><div class="field"><label>Adresse</label><input name="address"></div></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn">Créer le client</button>`;if(page==='documents')html=`<div class="grid2"><div class="field"><label>Type</label><select name="kind"><option value="devis">Devis</option><option value="facture">Facture</option></select></div><div class="field"><label>Client</label><select name="client_id"><option value="">—</option>${opts}</select></div><div class="field"><label>Prestation</label><input name="label" required></div><div class="field"><label>Montant €</label><input name="amount" type="number" step="0.01"></div><div class="field"><label>Échéance</label><input name="due_date" type="date"></div></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn">Créer le document</button>`;if(page==='tasks')html=`<div class="field"><label>Client</label><select name="client_id"><option value="">—</option>${opts}</select></div><div class="field"><label>Tâche *</label><input name="title" required></div><div class="grid2"><div class="field"><label>Échéance</label><input name="due_date" type="date"></div><div class="field"><label>Priorité</label><select name="priority"><option>normale</option><option>haute</option><option>basse</option></select></div></div><button class="btn">Ajouter</button>`;$('#form').innerHTML=html;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}window.closeModal=closeModal;$('#form').addEventListener('submit',async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.action=page==='clients'?'client.create':page==='documents'?'document.create':'task.create';const d=await api('',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(o)});if(d?.ok){closeModal();load()}else alert(d?.error||'Erreur')});
$('#newBtn').onclick=openNew;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;load()});$('#loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin-login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#password').value})});if(r.ok){$('#password').value='';load()}else $('#msg').textContent='Mot de passe incorrect ou configuration incomplète.'};$('#logout').onclick=async()=>{await fetch('/api/admin-logout',{method:'POST',credentials:'same-origin'});location.reload()};load();
</script></body></html>
