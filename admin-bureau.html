<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bureau Laur’Appui</title><style>
:root{--navy:#12364c;--gold:#a87338;--cream:#f7f0e5;--line:#ded7cd;--muted:#66737b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:Arial,sans-serif}.hidden{display:none!important}.login{width:min(440px,92%);margin:10vh auto;background:white;padding:30px;border-radius:20px;box-shadow:0 12px 40px #12364c18}.brand{font:700 28px Georgia,serif}.login input,input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c8c0b6;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn.gold{background:var(--gold)}.btn.sm{padding:7px 9px;font-size:12px}.btn.danger{background:#8b3a3a}.actions{display:flex;gap:6px;flex-wrap:wrap}.status-select{width:auto;min-width:125px;padding:7px 8px;border-radius:9px;font-size:12px}.client-detail{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.client-detail>div{background:#faf8f4;border:1px solid #eee7df;border-radius:10px;padding:10px}.section-title{margin:22px 0 8px;font-size:16px}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:var(--navy);color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh}.side .brand{margin-bottom:30px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#e9eef1;padding:12px;border-radius:9px;cursor:pointer;margin:2px 0;font-weight:600}.nav button.active,.nav button:hover{background:#ffffff18}.main{padding:30px;max-width:1450px;width:100%}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px #12364c0b}.metric b{display:block;font:700 27px Georgia,serif;margin-top:5px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;background:#fff}.tbl th,.tbl td{padding:12px;border-bottom:1px solid #eee7df;text-align:left;white-space:nowrap}.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#f0ebe4;font-size:12px}.modal{position:fixed;inset:0;background:#102d3d99;display:grid;place-items:center;padding:20px}.modalbox{background:#fff;width:min(620px,96%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.close{float:right;background:none;border:0;font-size:25px;cursor:pointer}.notice{padding:12px;border-radius:10px;background:#fff5df;font-size:13px;margin:14px 0}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.cards{grid-template-columns:1fr 1fr}.main{padding:18px}}@media(max-width:520px){.cards,.grid2{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
.crm-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.crm-tab{border:1px solid #d9c7b3;background:#fff;color:#16324d;padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:700}.crm-tab.active{background:#16324d;color:#fff}.crm-pane{display:none}.crm-pane.active{display:block}.mail-ok{color:#26734d;font-weight:700}.mail-bad{color:#a14b38;font-weight:700}.request-row{cursor:pointer}.request-row:hover{background:#fbf5ec}.request-preview{max-width:240px;overflow:hidden;text-overflow:ellipsis}.request-detail{margin-top:14px}.request-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.request-detail-grid>div{background:#faf8f4;border:1px solid #eee7df;border-radius:10px;padding:11px}.request-message{margin-top:12px;background:#fffaf3;border:1px solid #ead9c5;border-radius:12px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.request-hint{font-size:12px;color:var(--muted);margin:4px 0 10px}@media(max-width:520px){.request-detail-grid{grid-template-columns:1fr}}</style></head><body><section id="login" class="login"><div class="brand">Laur’Appui</div><h1>Bureau privé</h1><p class="muted">Gestion clients, devis, suivi Abby, paiements et échéances.</p><form id="loginForm"><input id="password" type="password" placeholder="Mot de passe administrateur" required><p><button class="btn">Se connecter</button></p><div id="msg" class="muted"></div></form></section>
<div id="app" class="app hidden"><aside class="side"><div class="brand">Laur’Appui</div><nav class="nav"><button data-page="dashboard" class="active">⌂ Tableau de bord</button><button data-page="clients">♙ Clients</button><button data-page="documents">▤ Devis & suivi Abby</button><button data-page="payments">€ Paiements</button><button data-page="tasks">✓ Échéances</button></nav><p><button id="logout" class="btn gold">Déconnexion</button></p></aside><main class="main"><div class="top"><div><h1 id="title">Tableau de bord</h1><div class="muted">Bureau Laur’Appui — gestion interne</div></div><button id="newBtn" class="btn" type="button" onclick="openNew()">+ Nouveau</button></div><div class="notice">Laur’Appui — SIRET 130 404 841 00012. Régime de TVA, médiateur et coordonnées bancaires : à compléter après confirmation.</div><div id="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">Nouveau</h2><form id="form"></form></div></div>
<script>
const $=s=>document.querySelector(s), app=$('#app'),login=$('#login'),content=$('#content');const validPages=['dashboard','clients','documents','payments','tasks'];let page=validPages.includes(location.hash.slice(1))?location.hash.slice(1):'dashboard',clients=[],navSeq=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const euro=c=>(Number(c||0)/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
async function api(section,opts){const u=section?'/api/admin-office?section='+section:'/api/admin-office';const r=await fetch(u,{cache:'no-store',credentials:'same-origin',...(opts||{})});if(r.status===401){app.classList.add('hidden');login.classList.remove('hidden');return null}return r.json()}
async function load(){
 const mySeq=++navSeq, requestedPage=page; let d;
 if(page==='payments'){
  const r=await fetch('/api/admin-payments',{cache:'no-store',credentials:'same-origin'});
  if(r.status===401){app.classList.add('hidden');login.classList.remove('hidden');return}
  d=await r.json().catch(()=>({ok:false,error:'Réponse serveur invalide'}));
  if(!r.ok||!d.ok){content.innerHTML=`<div class="card"><h2>Paiements</h2><p>${esc(d.error||'Impossible de charger les paiements.')}</p></div>`}
 }else d=await api(page);
 if(!d||mySeq!==navSeq||requestedPage!==page)return;
 login.classList.add('hidden');app.classList.remove('hidden');
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const titles={dashboard:'Tableau de bord',clients:'Clients',documents:'Devis & suivi Abby',payments:'Paiements',tasks:'Échéances'};
 $('#title').textContent=titles[page];$('#newBtn').style.visibility=(page==='dashboard'||page==='payments')?'hidden':'visible';
 if(page==='dashboard')renderDash(d);else if(page==='clients'){clients=d.items;renderClients(d.items)}else if(page==='documents')renderDocs(d.items,d.abby||[]);else if(page==='payments')renderPayments(d);else renderTasks(d.items)
}
function renderDash(d){let m=d.metrics||{};content.innerHTML=`<div class="cards"><div class="card metric"><span class="muted">Clients actifs</span><b>${m.clients||0}</b></div><div class="card metric"><span class="muted">Devis internes</span><b>${m.documents||0}</b></div><div class="card metric"><span class="muted">Échéances ouvertes</span><b>${m.tasks||0}</b></div><div class="card metric"><span class="muted">Paiements Stripe</span><b>${euro(m.stripe)}</b></div></div><div class="card"><h2>Derniers documents</h2>${tableDocs(d.recent||[])}</div>`}
function tableDocs(a){return `<div class="tablewrap"><table class="tbl"><thead><tr><th>N°</th><th>Client</th><th>Prestation</th><th>Montant</th><th>Paiement prévu</th><th>Statut</th><th>Action</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.client_name||'—')}</td><td>${esc(x.label)}</td><td>${euro(x.amount_cents)}</td><td>${esc(x.payment_plan||'—')}</td><td><span class="badge">${esc(x.status)}</span></td><td>${x.status==='brouillon'?`<button class="btn" onclick="setDocStatus(${x.id},'accepte')">Accepté</button> <button class="btn gold" onclick="setDocStatus(${x.id},'refuse')">Refusé</button>`:x.status==='accepte'?`<button class="btn gold" onclick="setDocStatus(${x.id},'a-facturer-abby')">À facturer Abby</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7">Aucun devis.</td></tr>'}</tbody></table></div>`}
async function setDocStatus(id,status){const d=await api('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'status',entity:'document',id,status})});if(d?.ok)load();else alert(d?.error||'Erreur')}window.setDocStatus=setDocStatus;
function statusLabel(s){return ({prospect:'Prospect',actif:'Client actif',ancien:'Ancien client',archive:'Archivé'}[s]||s||'—')}
function renderClients(a){clients=a;content.innerHTML=`<div class="card"><div class="toolbar"><div><b id="clientCount">${a.length} fiche(s)</b><div class="muted">Prospects, clients actifs, anciens clients et archives.</div></div></div><div class="grid2" style="margin-bottom:16px"><div class="field"><label>Rechercher un client</label><input id="clientSearch" placeholder="Nom, entreprise, e-mail, téléphone ou SIRET" oninput="filterClients()"></div><div class="field"><label>Filtrer / trier</label><div style="display:flex;gap:8px"><select id="clientStatusFilter" onchange="filterClients()"><option value="">Tous les statuts</option><option value="prospect">Prospects</option><option value="actif">Clients actifs</option><option value="ancien">Anciens clients</option><option value="archive">Archivés</option></select><select id="clientSort" onchange="filterClients()"><option value="recent">Plus récents</option><option value="name">Nom A → Z</option><option value="activity">Dernière activité</option><option value="status">Statut</option></select></div></div></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Nom</th><th>Type</th><th>E-mail</th><th>Téléphone</th><th>Statut</th><th>Source</th><th>Actions</th></tr></thead><tbody id="clientRows"></tbody></table></div></div>`;filterClients()}
function filterClients(){const q=($('#clientSearch')?.value||'').toLowerCase().trim(),st=$('#clientStatusFilter')?.value||'',sort=$('#clientSort')?.value||'recent';let a=clients.filter(x=>(!st||x.status===st)&&(!q||[x.name,x.company,x.email,x.phone,x.siret].some(v=>String(v||'').toLowerCase().includes(q))));a.sort((x,y)=>sort==='name'?String(x.name||'').localeCompare(String(y.name||''),'fr'):sort==='status'?String(x.status||'').localeCompare(String(y.status||''),'fr'):sort==='activity'?String(y.updated_at||y.created_at||'').localeCompare(String(x.updated_at||x.created_at||'')):Number(y.id)-Number(x.id));if($('#clientCount'))$('#clientCount').textContent=a.length+' fiche(s)';$('#clientRows').innerHTML=a.map(x=>`<tr><td><b>${esc(x.name)}</b>${x.company?'<br><span class="muted">'+esc(x.company)+'</span>':''}</td><td>${esc(x.type)}</td><td>${esc(x.email||'—')}</td><td>${esc(x.phone||'—')}</td><td><select class="status-select" onchange="setClientStatus(${x.id},this.value)"><option value="prospect" ${x.status==='prospect'?'selected':''}>Prospect</option><option value="actif" ${x.status==='actif'?'selected':''}>Client actif</option><option value="ancien" ${x.status==='ancien'?'selected':''}>Ancien client</option><option value="archive" ${x.status==='archive'?'selected':''}>Archivé</option></select></td><td>${esc(x.source||'manuel')}</td><td><div class="actions"><button class="btn sm gold" onclick="viewClient(${x.id})">Voir la fiche</button><button class="btn sm" onclick="editClient(${x.id})">Modifier</button><button class="btn sm danger" onclick="deleteClient(${x.id})">Supprimer</button></div></td></tr>`).join('')||'<tr><td colspan="7">Aucun client correspondant.</td></tr>'}
window.filterClients=filterClients;
async function setClientStatus(id,status){const d=await api('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'status',entity:'client',id,status})});if(d?.ok)load();else{alert(d?.error||'Erreur');load()}}
async function viewClient(id){const r=await fetch('/api/admin-office?section=client-detail&id='+encodeURIComponent(id),{cache:'no-store',credentials:'same-origin'});const d=await r.json().catch(()=>({ok:false,error:'Réponse invalide'}));if(!r.ok||!d.ok){alert(d.error||'Impossible de charger la fiche');return}const c=d.client||{},fmt=x=>x?new Date(x).toLocaleString('fr-FR'):'—',reqLabel=v=>({'devis':'Demande de devis gratuit','appel-gratuit':'Appel gratuit — 15 min','rendez-vous':'Prendre rendez-vous','autre':'Autre demande'}[v]||v||'—'),contactLabel=v=>({email:'E-mail',sms:'SMS'}[v]||v||'—'),mailLabel=v=>v==='envoye'?'Envoyé ✓':v==='echec'?'Échec':v==='non-configure'?'E-mail non configuré':'—';$('#modalTitle').textContent='Fiche client — '+(c.name||'');const requestData=d.requests||[];window.__clientRequests=requestData;window.__requestHelpers={fmt,reqLabel,contactLabel,mailLabel};const requests=requestData.map((x,i)=>`<tr class="request-row" data-request-index="${i}" title="Cliquer pour voir la demande complète"><td>${esc(fmt(x.created_at))}</td><td>${esc(reqLabel(x.request_type))}</td><td>${esc(x.offer||x.subject||'—')}</td><td class="request-preview">${esc(x.message||'—')}</td><td>${esc(contactLabel(x.preferred_contact))}</td><td><span class="${x.client_email_status==='envoye'?'mail-ok':'mail-bad'}">${esc(mailLabel(x.client_email_status))}</span></td></tr>`).join('')||'<tr><td colspan="6">Aucune demande depuis le site.</td></tr>';$('#form').innerHTML=`<div class="actions"><button type="button" class="btn" onclick="closeModal();editClient(${c.id})">Modifier la fiche</button><button type="button" class="btn gold" onclick="openExchange(${c.id})">+ Ajouter un échange</button></div><div class="crm-tabs"><button type="button" class="crm-tab active" data-tab="info">Informations</button><button type="button" class="crm-tab" data-tab="requests">Demandes</button><button type="button" class="crm-tab" data-tab="exchanges">Échanges</button><button type="button" class="crm-tab" data-tab="quotes">Devis</button><button type="button" class="crm-tab" data-tab="abby">Factures Abby</button><button type="button" class="crm-tab" data-tab="payments">Paiements</button><button type="button" class="crm-tab" data-tab="tasks">Échéances</button></div><div class="crm-pane active" data-pane="info"><div class="client-detail"><div><b>Statut</b><br>${esc(statusLabel(c.status))}</div><div><b>Type</b><br>${esc(c.type||'—')}</div><div><b>E-mail</b><br>${esc(c.email||'—')}</div><div><b>Téléphone</b><br>${esc(c.phone||'—')}</div><div><b>Entreprise</b><br>${esc(c.company||'—')}</div><div><b>SIRET</b><br>${esc(c.siret||'—')}</div><div><b>Adresse</b><br>${esc([c.address,c.postal_code,c.city,c.country].filter(Boolean).join(', ')||'—')}</div><div><b>Source</b><br>${esc(c.source||'manuel')}</div></div>${c.notes?`<div class="notice"><b>Notes</b><br>${esc(c.notes)}</div>`:''}</div><div class="crm-pane" data-pane="requests"><h3 class="section-title">Demandes du site</h3><div class="request-hint">Cliquez sur une demande pour afficher tout son contenu.</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Date</th><th>Demande</th><th>Offre / sujet</th><th>Message</th><th>Contact</th><th>Confirmation</th></tr></thead><tbody>${requests}</tbody></table></div></div><div class="crm-pane" data-pane="exchanges"><h3 class="section-title">Échanges & suivi</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Résumé</th><th>Prochaine action</th></tr></thead><tbody>${(d.exchanges||[]).map(x=>`<tr><td>${esc(fmt(x.exchange_at))}</td><td>${esc(x.exchange_type)}</td><td>${esc(x.summary)}</td><td>${esc(x.next_action||'—')}</td></tr>`).join('')||'<tr><td colspan="4">Aucun échange consigné.</td></tr>'}</tbody></table></div></div><div class="crm-pane" data-pane="quotes"><h3 class="section-title">Devis Laur’Appui</h3>${tableDocs(d.documents||[])}</div><div class="crm-pane" data-pane="abby"><h3 class="section-title">Factures Abby</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>N°</th><th>Prestation</th><th>Montant</th><th>Statut</th></tr></thead><tbody>${(d.abby||[]).map(x=>`<tr><td>${esc(x.abby_number)}</td><td>${esc(x.label)}</td><td>${euro(x.amount_cents)}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="4">Aucune facture Abby.</td></tr>'}</tbody></table></div></div><div class="crm-pane" data-pane="payments"><h3 class="section-title">Paiements</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Date</th><th>Prestation</th><th>Montant</th></tr></thead><tbody>${(d.payments||[]).map(x=>`<tr><td>${esc(x.paid_at||'—')}</td><td>${esc(x.offer_label||'—')}</td><td>${euro(x.amount_total)}</td></tr>`).join('')||'<tr><td colspan="3">Aucun paiement.</td></tr>'}</tbody></table></div></div><div class="crm-pane" data-pane="tasks"><h3 class="section-title">Échéances</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Date</th><th>Tâche</th><th>Statut</th></tr></thead><tbody>${(d.tasks||[]).map(x=>`<tr><td>${esc(x.due_date||'—')}</td><td>${esc(x.title)}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="3">Aucune échéance.</td></tr>'}</tbody></table></div></div>`;$('#form').querySelectorAll('.crm-tab').forEach(btn=>btn.onclick=()=>{$('#form').querySelectorAll('.crm-tab').forEach(x=>x.classList.remove('active'));$('#form').querySelectorAll('.crm-pane').forEach(x=>x.classList.remove('active'));btn.classList.add('active');$('#form').querySelector(`[data-pane="${btn.dataset.tab}"]`).classList.add('active')});$('#form').querySelectorAll('.request-row').forEach(row=>row.onclick=()=>openRequestDetail(Number(row.dataset.requestIndex)));$('#modal').classList.remove('hidden')}
function openExchange(id){$('#modalTitle').textContent='Ajouter un échange';const now=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);$('#form').innerHTML=`<input type="hidden" name="action" value="exchange.create"><input type="hidden" name="client_id" value="${id}"><div class="grid2"><div class="field"><label>Type d’échange *</label><select name="exchange_type"><option value="appel">Appel téléphonique</option><option value="sms">SMS</option><option value="email">E-mail</option><option value="rendez-vous">Rendez-vous</option><option value="relance">Relance</option><option value="note">Note interne</option></select></div><div class="field"><label>Date et heure</label><input type="datetime-local" name="exchange_at" value="${now}"></div></div><div class="field"><label>Résumé *</label><textarea name="summary" required placeholder="Résumé de l’échange avec le client"></textarea></div><div class="field"><label>Prochaine action</label><input name="next_action" placeholder="Ex. rappeler vendredi, envoyer le devis..."></div><button class="btn" type="submit">Enregistrer l’échange</button>`;$('#modal').classList.remove('hidden')}
window.openExchange=openExchange;
window.setClientStatus=setClientStatus;window.viewClient=viewClient;
async function deleteClient(id){if(!confirm('Supprimer définitivement cette fiche ? Si elle possède un historique, la suppression sera refusée et vous pourrez l’archiver.'))return;const d=await api('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'client.delete',id})});if(d?.ok)load();else alert(d?.error||'Erreur')}
function renderDocs(a,abby){content.innerHTML=`<div class="card" style="margin-bottom:18px"><div class="toolbar"><div><b>Organisation Abby</b><div class="muted" style="margin-top:6px">Laur’Appui conserve le suivi commercial. Les factures officielles sont créées et numérotées dans Abby.</div></div><span class="badge" style="font-weight:700">Facturation officielle : Abby</span></div><div class="grid2"><div><b>Client professionnel</b><div class="muted" style="margin-top:7px;line-height:1.7">Devis validé → créer la facture officielle dans Abby → transmettre via Abby / circuit réglementaire → reporter ici le n° Abby et le statut → enregistrer le règlement.</div></div><div><b>Client particulier</b><div class="muted" style="margin-top:7px;line-height:1.7">Devis validé → créer la facture officielle dans Abby → remettre/envoyer la facture au client → Abby gère les données réglementaires applicables → reporter ici le suivi du paiement.</div></div></div></div><div class="card" style="margin-bottom:18px"><div class="toolbar"><b>Factures officielles Abby</b><button class="btn gold" onclick="openAbbyInvoice()">+ Enregistrer une facture Abby</button></div><div class="tablewrap"><table class="tbl"><thead><tr><th>N° Abby</th><th>Client</th><th>Prestation</th><th>Montant</th><th>Émission</th><th>Échéance</th><th>Paiement</th><th>Statut</th></tr></thead><tbody>${abby.map(x=>`<tr><td><b>${esc(x.abby_number)}</b></td><td>${esc(x.client_name||'—')}</td><td>${esc(x.label)}</td><td>${euro(x.amount_cents)}</td><td>${esc(x.issue_date||'—')}</td><td>${esc(x.due_date||'—')}</td><td>${esc(x.payment_method||'—')}</td><td><span class="badge">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="8">Aucune facture Abby enregistrée.</td></tr>'}</tbody></table></div></div><div class="card"><div class="toolbar"><b>Devis Laur’Appui</b><span class="muted">Les factures ne sont plus générées ici.</span></div>${tableDocs(a)}</div>`}

function openRequestDetail(index){const x=(window.__clientRequests||[])[index];if(!x)return;const h=window.__requestHelpers||{};const fmt=h.fmt||((v)=>v||'—'),reqLabel=h.reqLabel||((v)=>v||'—'),contactLabel=h.contactLabel||((v)=>v||'—'),mailLabel=h.mailLabel||((v)=>v||'—');const oldTitle=$('#modalTitle').textContent;const oldHtml=$('#form').innerHTML;$('#modalTitle').textContent='Détail de la demande';$('#form').innerHTML=`<div class="actions"><button type="button" class="btn" id="backToClient">← Retour à la fiche client</button></div><div class="request-detail"><div class="request-detail-grid"><div><b>Date et heure</b><br>${esc(fmt(x.created_at))}</div><div><b>Type de demande</b><br>${esc(reqLabel(x.request_type))}</div><div><b>Offre / sujet</b><br>${esc(x.offer||x.subject||'—')}</div><div><b>Préférence de contact</b><br>${esc(contactLabel(x.preferred_contact))}</div><div><b>Confirmation client</b><br><span class="${x.client_email_status==='envoye'?'mail-ok':'mail-bad'}">${esc(mailLabel(x.client_email_status))}</span></div><div><b>E-mail client</b><br>${esc(x.email||x.customer_email||'—')}</div></div><div class="request-message"><b>Message complet</b><br><br>${esc(x.message||'—')}</div></div>`;$('#backToClient').onclick=()=>{$('#modalTitle').textContent=oldTitle;$('#form').innerHTML=oldHtml;$('#form').querySelectorAll('.crm-tab').forEach(btn=>btn.onclick=()=>{$('#form').querySelectorAll('.crm-tab').forEach(y=>y.classList.remove('active'));$('#form').querySelectorAll('.crm-pane').forEach(y=>y.classList.remove('active'));btn.classList.add('active');$('#form').querySelector(`[data-pane="${btn.dataset.tab}"]`).classList.add('active')});$('#form').querySelectorAll('.request-row').forEach(row=>row.onclick=()=>openRequestDetail(Number(row.dataset.requestIndex)));const reqTab=$('#form').querySelector('[data-tab="requests"]');if(reqTab)reqTab.click()}}
window.openRequestDetail=openRequestDetail;
async function openAbbyInvoice(){if(!clients.length){const d=await api('clients');clients=d?.items||[]}const opts=clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('#modalTitle').textContent='Enregistrer une facture Abby';$('#form').innerHTML=`<input type="hidden" name="action" value="abby.invoice.create"><div class="grid2"><div class="field"><label>N° facture Abby *</label><input name="abby_number" required placeholder="Ex. F2027-001"></div><div class="field"><label>Client</label><select name="client_id"><option value="">—</option>${opts}</select></div><div class="field"><label>Prestation</label><input name="label" required></div><div class="field"><label>Montant €</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>Date d’émission</label><input name="issue_date" type="date"></div><div class="field"><label>Échéance</label><input name="due_date" type="date"></div><div class="field"><label>Mode de paiement</label><select name="payment_method"><option value="">—</option><option>Stripe</option><option>Virement</option><option>Chèque</option><option>Espèces</option></select></div><div class="field"><label>Statut</label><select name="status"><option value="envoyee">Envoyée</option><option value="a-facturer">À facturer</option><option value="partiellement-payee">Partiellement payée</option><option value="payee">Payée</option><option value="en-retard">En retard</option><option value="avoir">Avoir</option></select></div></div><div class="field"><label>Lien Abby (facultatif)</label><input name="abby_url" type="url" placeholder="Lien vers le document Abby"></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn">Enregistrer le suivi Abby</button>`;$('#modal').classList.remove('hidden')}
window.openAbbyInvoice=openAbbyInvoice;
async function renderPayments(d){const a=d.payments||[],m=d.summary||{};let st={stripe:false,db:true};try{const r=await fetch('/api/stripe-status',{cache:'no-store',credentials:'same-origin'});if(r.ok)st=await r.json()}catch{}const ready=!!st.stripe;content.innerHTML=`<div class="card" style="margin-bottom:18px"><div class="toolbar"><div><b>Configuration Stripe</b><div class="muted" style="margin-top:6px">Les liens de paiement Stripe sont actifs sur le site. La synchronisation automatique des paiements avec le Bureau dépend de la configuration du webhook.</div></div><span class="badge" style="font-weight:700">${ready?'🟢 Stripe connecté':'🟠 En attente de configuration'}</span></div><div class="grid2"><div><b>Offres préparées</b><div class="muted" style="margin-top:7px;line-height:1.7">Diagnostic Budget — 90 €<br>Sérénité Budget — 180 €<br>Sérénité VIP trimestriel — 360 €<br>Sérénité VIP annuel — 1 100 €<br><span style="font-size:12px">Les facilités de paiement sont proposées par les moyens de paiement disponibles (ex. PayPal/Scalapay) selon l’éligibilité du client.</span></div></div><div><b>Activation future</b><div class="muted" style="margin-top:7px;line-height:1.7">Liens Stripe de production intégrés au site<br>Webhook sécurisé à configurer pour la remontée automatique<br>Enregistrement des paiements dans le Bureau après connexion du webhook<br>Facturation officielle conservée dans Abby</div></div></div></div><div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card metric"><span class="muted">Paiements enregistrés</span><b>${m.count||0}</b></div><div class="card metric"><span class="muted">Total encaissé enregistré</span><b>${euro(m.cents||0)}</b></div></div><div class="card"><div class="toolbar"><b>Paiements & justificatifs</b><a class="btn gold" href="/api/admin-export">Exporter CSV</a></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Réf.</th><th>Date</th><th>Client</th><th>Prestation</th><th>Montant</th><th>Justificatif</th></tr></thead><tbody>${a.map(x=>`<tr><td>REC-${String(x.id).padStart(6,'0')}</td><td>${x.paid_at?new Date(x.paid_at).toLocaleDateString('fr-FR'):'—'}</td><td><b>${esc(x.customer_name||'—')}</b><br><span class="muted">${esc(x.customer_email||'')}</span></td><td>${esc(x.offer_label||'Prestation Laur’Appui')}</td><td><b>${euro(x.amount_total)}</b></td><td><a href="/api/recu?token=${encodeURIComponent(x.receipt_token||'')}" target="_blank" rel="noopener">Ouvrir / PDF</a></td></tr>`).join('')||'<tr><td colspan="6">Aucun paiement enregistré.</td></tr>'}</tbody></table></div></div>`}
function renderTasks(a){content.innerHTML=`<div class="card"><div class="toolbar"><b>Échéances & tâches</b></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Échéance</th><th>Client</th><th>Tâche</th><th>Priorité</th><th>Statut</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.due_date||'—')}</td><td>${esc(x.client_name||'—')}</td><td>${esc(x.title)}</td><td>${esc(x.priority)}</td><td><span class="badge">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="5">Aucune échéance.</td></tr>'}</tbody></table></div></div>`}
function clientFormHtml(c={}){const edit=!!c.id;return `<input type="hidden" name="action" value="${edit?'client.update':'client.create'}">${edit?`<input type="hidden" name="id" value="${c.id}">`:''}<div class="notice">${edit?'Corrigez la fiche client et son statut.':'Créez ici une fiche prospect ou client. Elle sera disponible dans les devis et le suivi Abby.'}</div><div class="grid2"><div class="field"><label>Type *</label><select name="type" id="clientType" required onchange="toggleClientFields()"><option value="particulier" ${c.type==='particulier'?'selected':''}>Particulier</option><option value="professionnel" ${c.type==='professionnel'?'selected':''}>Professionnel</option></select></div><div class="field"><label>Statut *</label><select name="status"><option value="prospect" ${c.status==='prospect'?'selected':''}>Prospect</option><option value="actif" ${(!c.status||c.status==='actif')?'selected':''}>Client actif</option><option value="ancien" ${c.status==='ancien'?'selected':''}>Ancien client</option><option value="archive" ${c.status==='archive'?'selected':''}>Archivé</option></select></div><div class="field"><label>Nom / contact *</label><input name="name" required value="${esc(c.name||'')}" placeholder="Nom et prénom"></div></div><div id="proClientFields" class="hidden"><div class="grid2"><div class="field"><label>Entreprise / raison sociale *</label><input name="company" id="clientCompany" value="${esc(c.company||'')}" placeholder="Raison sociale"></div><div class="field"><label>SIRET <span class="muted">(facultatif à la création)</span></label><input name="siret" id="clientSiret" inputmode="numeric" maxlength="14" value="${esc(c.siret||'')}" placeholder="14 chiffres — à compléter avant facturation Abby"></div><div class="field"><label>N° TVA intracommunautaire</label><input name="vat_number" value="${esc(c.vat_number||'')}"></div></div></div><div class="grid2"><div class="field"><label>E-mail *</label><input name="email" type="email" required value="${esc(c.email||'')}"></div><div class="field"><label>Téléphone *</label><input name="phone" required value="${esc(c.phone||'')}"></div><div class="field"><label>Adresse</label><input name="address" value="${esc(c.address||'')}"></div><div class="field"><label>Code postal</label><input name="postal_code" value="${esc(c.postal_code||'')}"></div><div class="field"><label>Ville</label><input name="city" value="${esc(c.city||'')}"></div><div class="field"><label>Pays</label><input name="country" value="${esc(c.country||'France')}"></div></div><div class="field"><label>Notes</label><textarea name="notes">${esc(c.notes||'')}</textarea></div><button class="btn" type="submit">${edit?'Enregistrer les modifications':'Créer la fiche'}</button>`}
function toggleClientFields(){const t=$('#clientType'),p=$('#proClientFields'),c=$('#clientCompany'),si=$('#clientSiret');if(!t||!p)return;const pro=t.value==='professionnel';p.classList.toggle('hidden',!pro);if(c)c.required=pro;if(si)si.required=false}

function openClientModal(){
 $('#modalTitle').textContent='Nouveau client';
 $('#form').innerHTML=clientFormHtml();
 $('#modal').classList.remove('hidden');
 toggleClientFields();
}
function editClient(id){const c=clients.find(x=>Number(x.id)===Number(id));if(!c)return;$('#modalTitle').textContent='Modifier la fiche';$('#form').innerHTML=clientFormHtml(c);$('#modal').classList.remove('hidden');toggleClientFields()}
window.editClient=editClient;window.setClientStatus=setClientStatus;window.viewClient=viewClient;window.deleteClient=deleteClient;
async function openNew(){
 if(page==='clients'){openClientModal();return}
 if(page!=='clients'){
  const d=await api('clients');
  clients=d?.items||[];
 }
 const clientLabel=c=>c.type==='professionnel'?(c.company?`${c.company} — ${c.name} — Professionnel`:`${c.name} — Professionnel`):`${c.name} — Particulier`;
 const opts=clients.map(c=>`<option value="${c.id}">${esc(clientLabel(c))}</option>`).join('');
 const noClient=!clients.length;
 let html='';if(page==='documents'){ $('#modalTitle').textContent='Nouveau devis'; html=`<input type="hidden" name="kind" value="devis"><div class="notice">Le Bureau enregistre le devis et son suivi commercial. Après acceptation, la facture officielle sera créée dans Abby.</div><div class="grid2"><div class="field"><label>Client *</label><select name="client_id" required ${noClient?'disabled':''}><option value="">${noClient?'Aucun client enregistré — créez d’abord un client':'— Choisir —'}</option>${opts}</select>${noClient?'<div class="muted" style="margin-top:7px">Fermez cette fenêtre, ouvrez <b>Clients</b> puis cliquez sur <b>+ Nouveau</b>. Le client apparaîtra ensuite automatiquement ici.</div>':''}</div><div class="field"><label>Prestation *</label><input name="label" required placeholder="Ex. Sérénité Budget"></div><div class="field"><label>Montant € *</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Paiement prévu</label><select name="payment_plan"><option value="comptant">Comptant</option><option value="3x">3 fois</option><option value="4x">4 fois</option><option value="12x-vip-annuel">12 fois — VIP annuel uniquement</option></select></div><div class="field"><label>Date du devis</label><input name="quote_date" type="date"></div><div class="field"><label>Échéance / validité</label><input name="due_date" type="date"></div><div class="field"><label>Statut initial</label><select name="status"><option value="brouillon">Brouillon</option><option value="envoye">Envoyé</option><option value="accepte">Accepté</option><option value="refuse">Refusé</option></select></div></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn">Enregistrer le devis</button>`;}if(page==='tasks'){ $('#modalTitle').textContent='Nouvelle échéance'; html=`<div class="field"><label>Client</label><select name="client_id"><option value="">—</option>${opts}</select></div><div class="field"><label>Tâche *</label><input name="title" required></div><div class="grid2"><div class="field"><label>Échéance</label><input name="due_date" type="date"></div><div class="field"><label>Priorité</label><select name="priority"><option>normale</option><option>haute</option><option>basse</option></select></div></div><button class="btn">Ajouter</button>`;}$('#form').innerHTML=html;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}window.closeModal=closeModal;window.openNew=openNew;window.openClientModal=openClientModal;$('#form').addEventListener('submit',async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));if(!o.action)o.action=page==='clients'?'client.create':page==='documents'?'document.create':'task.create';const d=await api('',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(o)});if(d?.ok){closeModal();load()}else alert(d?.error||'Erreur')});
$('#newBtn').addEventListener('click',e=>{e.preventDefault();openNew()});document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;history.replaceState(null,'','#'+page);load()});window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(validPages.includes(p)&&p!==page){page=p;load()}});$('#loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin-login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#password').value})});if(r.ok){$('#password').value='';load()}else $('#msg').textContent='Mot de passe incorrect ou configuration incomplète.'};$('#logout').onclick=async()=>{await fetch('/api/admin-logout',{method:'POST',credentials:'same-origin'});location.reload()};load();
</script></body></html>
