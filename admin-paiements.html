<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Paiements & justificatifs — Laur’Appui</title><link rel="stylesheet" href="style.css"><style>
body{background:#f7f0e5;color:#12364c}.adm{width:min(1180px,94%);margin:40px auto 70px}.adm-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.adm-brand{font:700 28px Georgia,serif}.adm-card{background:#fff;border:1px solid #d9d2c8;border-radius:18px;padding:22px;box-shadow:0 8px 28px #12364c12}.login{max-width:460px;margin:80px auto}.login input,.tools input{box-sizing:border-box;width:100%;padding:13px 14px;border:1px solid #b9b2a8;border-radius:10px;font-size:15px}.btnx{border:0;border-radius:10px;padding:12px 17px;background:#12364c;color:#fff;font-weight:700;cursor:pointer}.btnx.alt{background:#9a6d37}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:18px 0}.metric b{display:block;font:700 27px Georgia,serif}.metric span{font-size:13px;color:#5c6770}.tools{display:flex;gap:10px;margin:18px 0}.tools input{max-width:430px}.tablewrap{overflow:auto}.paytable{width:100%;border-collapse:collapse;font-size:14px}.paytable th,.paytable td{text-align:left;padding:12px 10px;border-bottom:1px solid #e7e1d8;white-space:nowrap}.paytable th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#5c6770}.paytable a{color:#9a6d37;font-weight:700}.empty{text-align:center;padding:35px;color:#6a747b}.msg{font-size:13px;color:#a23b31;margin-top:10px}.hidden{display:none!important}@media(max-width:700px){.adm{margin-top:20px}.adm-head{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:1fr}.tools{flex-direction:column}.paytable{font-size:13px}}
</style></head><body><main class="adm"><section id="login" class="adm-card login"><div class="adm-brand">Laur’Appui</div><h1>Espace privé Laura</h1><p>Paiements & justificatifs</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe administrateur" required><p><button class="btnx" type="submit">Se connecter</button></p><div id="loginMsg" class="msg"></div></form></section>
<section id="panel" class="hidden"><div class="adm-head"><div><div class="adm-brand">Laur’Appui</div><h1>Paiements & justificatifs</h1></div><button id="logout" class="btnx">Déconnexion</button></div><div class="summary"><div class="adm-card metric"><span>Paiements enregistrés</span><b id="count">—</b></div><div class="adm-card metric"><span>Total encaissé enregistré</span><b id="total">—</b></div></div><div class="adm-card"><div class="tools"><input id="search" type="search" placeholder="Rechercher client, e-mail ou prestation…"><button id="refresh" class="btnx">Actualiser</button><a class="btnx alt" href="/api/admin-export">Exporter CSV</a></div><div class="tablewrap"><table class="paytable"><thead><tr><th>Réf.</th><th>Date</th><th>Client</th><th>Prestation</th><th>Montant</th><th>Justificatif</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty hidden">Aucun paiement enregistré.</div></div></section></main><script>
const $=s=>document.querySelector(s), login=$('#login'),panel=$('#panel'),rows=$('#rows'),empty=$('#empty');
const money=(c,cur='eur')=>(Number(c)/100).toLocaleString('fr-FR',{style:'currency',currency:String(cur).toUpperCase()});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const q=$('#search')?.value||'';const r=await fetch('/api/admin-payments?q='+encodeURIComponent(q),{cache:'no-store',credentials:'same-origin'});if(r.status===401){login.classList.remove('hidden');panel.classList.add('hidden');return}const d=await r.json();if(!d.ok)return;login.classList.add('hidden');panel.classList.remove('hidden');$('#count').textContent=d.summary?.count??0;$('#total').textContent=money(d.summary?.cents??0);rows.innerHTML=(d.payments||[]).map(p=>`<tr><td>REC-${String(p.id).padStart(6,'0')}</td><td>${new Date(p.paid_at).toLocaleDateString('fr-FR')}</td><td><b>${esc(p.customer_name||'—')}</b><br><small>${esc(p.customer_email||'')}</small></td><td>${esc(p.offer_label||'Prestation Laur’Appui')}</td><td><b>${money(p.amount_total,p.currency)}</b></td><td><a target="_blank" rel="noopener" href="/api/recu?token=${encodeURIComponent(p.receipt_token)}">Ouvrir / PDF</a></td></tr>`).join('');empty.classList.toggle('hidden',(d.payments||[]).length>0)}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginMsg').textContent='';const r=await fetch('/api/admin-login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#password').value})});const d=await r.json().catch(()=>({}));if(!r.ok){$('#loginMsg').textContent=d.error||'Connexion impossible';return}$('#password').value='';load()});
$('#logout').addEventListener('click',async()=>{await fetch('/api/admin-logout',{method:'POST',credentials:'same-origin'});location.reload()});$('#refresh').addEventListener('click',load);let timer;$('#search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,250)});load();
</script></body></html>
